name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run build
      - name: Parse PostgreSQL migrations
        run: |
          python -m pip install pglast==7.14
          python scripts/validate_sql.py
      - name: Check migration naming and whitespace
        shell: bash
        run: |
          test -f supabase/config.toml
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort
          git diff --check
